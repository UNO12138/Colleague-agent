<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>工具 · Alex Colleague Agent</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{overflow:hidden;background:#315b86 url('../desktop-background.png') center/cover fixed no-repeat;color:#2b2b2b;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(94vw,1512px);height:min(92vh,912px);min-height:680px;margin:4vh auto;display:grid;grid-template-columns:254px 1fr;grid-template-rows:40px 1fr;overflow:hidden;border:.5px solid rgba(17,17,17,.16);border-radius:9px;background:rgba(246,250,255,.80);box-shadow:0 4px 100px 4px rgba(0,0,0,.25)}body:not(.electron-window) .shell{backdrop-filter:blur(26px) saturate(132%);-webkit-backdrop-filter:blur(26px) saturate(132%)}body.electron-window{background:transparent}body.electron-window .shell{width:100%;height:100vh;min-height:0;margin:0;border:.5px solid rgba(17,17,17,.16);border-radius:8px;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 4px 100px 4px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}.bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.brand{width:28px;height:28px;margin-left:14px;padding:4px;border:0;background:transparent}.brand img{width:20px;height:20px}.window-controls{height:40px;display:flex}.window-control{width:46px;display:grid;place-items:center;padding:0;border:0;background:transparent}.window-control:hover{background:rgba(17,17,17,.07)}.window-control-icon{width:20px;height:20px;background:url('../figma-window-controls.svg') no-repeat;background-size:106.667px 20px}.window-control-icon.minimize{background-position:0 0}.window-control-icon.maximize{background-position:-43.333px 0}.window-control-icon.close{background-position:-86.667px 0}.sidebar{width:254px;min-width:0;padding:4px 12px 18px;overflow-y:auto;overflow-x:hidden}.name{margin:6px 8px 15px;font-size:18px;font-weight:500;letter-spacing:-.2px}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:transparent;text-align:left}.nav:hover{background:rgba(0,0,0,.045)}.nav img{width:18px;height:18px}.heading{min-height:27px;margin:17px 0 7px;padding:0 10px;color:rgba(17,17,17,.58);font-size:16px}.project{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:10px;background:transparent;text-align:left}.project img{width:18px;height:18px}.workspace{position:relative;margin:0 7px 7px 0;overflow:auto;border:1px solid rgba(17,17,17,.16);border-radius:8px;background:#fff;padding:64px}.workspace h1{margin:0;font-size:32px;font-weight:620}.workspace>p{margin:10px 0 34px;color:rgba(17,17,17,.58)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px}.card{padding:20px;border:1px solid rgba(17,17,17,.14);border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.05)}.card strong{display:block;font-size:16px}.card p{margin:8px 0 0;color:rgba(17,17,17,.58);line-height:1.6}.badge{display:inline-block;margin-top:18px;padding:5px 9px;border-radius:99px;background:#f1f2f6;color:rgba(17,17,17,.5);font-size:12px}@media(max-width:950px){.shell{width:100%;height:100vh;margin:0;border-radius:0;grid-template-columns:210px 1fr}.workspace{padding:40px}.grid{grid-template-columns:1fr}}
    body.embedded{background:#fff}
    body.embedded .shell{display:block;width:100%;height:100vh;min-height:0;margin:0;border:0;border-radius:0;background:#fff;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
    body.embedded .bar,body.embedded .sidebar{display:none}
    body.embedded .workspace{width:100%;height:100%;margin:0;border:0;border-radius:0}
  </style>
  <link rel="stylesheet" href="./page.css?v=20261007-5" />
</head>
<body>
  <script>(()=>{const params=new URLSearchParams(location.search);if(params.has('electron'))document.body.classList.add('electron-window');if(params.has('embedded'))document.body.classList.add('embedded');else location.replace(new URL(location.protocol==='file:'?'../index.html?electron=1#view=tools':`../?view=tools${params.has('electron')?'&electron=1':''}`,location.href).href)})()</script>
  <main class="shell">
    <header class="bar"><button class="brand" type="button"><img src="../figma-sidebar-toggle.svg" alt="" /></button><div class="window-controls"><button class="window-control" type="button"><span class="window-control-icon minimize"></span></button><button class="window-control" type="button"><span class="window-control-icon maximize"></span></button><button class="window-control" type="button"><span class="window-control-icon close"></span></button></div></header>
    <aside class="sidebar"><div class="name">Alex Colleague agent</div><button class="nav" id="newConversation"><img src="../new-conversation.svg" alt="" />新对话</button><button class="nav active"><img src="../assets/tools.svg" alt="" />工具</button><div class="heading">项目</div><button class="project"><img src="../project-collapsed.svg" alt="" />科比和詹姆斯对比</button><button class="project"><img src="../project-expanded.svg" alt="" />体验与智能产品创新</button></aside>
    <section class="workspace">
      <div class="tools-page">
        <header><h1>工具</h1><p>为主进程 Agent 提供统一入口</p></header>
        <div class="toolbar"><div class="tabs" role="tablist" aria-label="Agent 位置"><button class="tab" type="button" role="tab" data-tab="local" aria-selected="true">本地 <span>4</span></button><button class="tab" type="button" role="tab" data-tab="cloud" aria-selected="false">云端 <span>1</span></button></div><label class="search"><img src="../assets/figma-agents/230-imgFrame10.svg" alt="" /><input id="agentSearch" type="search" placeholder="搜索可用 Agent" aria-label="搜索可用 Agent" /></label></div>
        <div class="agent-list" id="agentList" aria-label="Agent 列表"></div>
        <section class="temporary-api" id="temporaryApi" hidden aria-labelledby="temporaryApiTitle">
          <h2 id="temporaryApiTitle">临时 API · DeepSeek</h2>
          <p>输入自己的 DeepSeek API 密钥，即可在网页中使用 AI。密钥只在当前页面内存中保留；刷新或关闭页面即清除。每次请求独立处理，不发送聊天历史。</p>
          <form id="temporaryApiKeyForm"><label for="temporaryApiKey">API 密钥</label><div class="api-key-entry"><input id="temporaryApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" required /><button type="submit">连接</button><button id="clearTemporaryApi" type="button">清除</button></div></form>
          <p id="temporaryApiStatus" role="status">尚未连接</p>
          <form id="temporaryApiAskForm"><label for="temporaryApiQuestion">单次提问</label><textarea id="temporaryApiQuestion" placeholder="输入问题；这次提问不会引用之前的对话" required></textarea><button type="submit">发送</button></form>
          <div class="temporary-api-answer" id="temporaryApiAnswer" role="status" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>
  <div class="dialog-layer" id="dialogLayer" aria-hidden="true">
    <section class="manage-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-header"><img id="dialogLogo" src="../assets/figma-agents/234-imgIcons8Chatgpt961.png" alt="" /><div><strong id="dialogTitle">Codex</strong><span id="dialogVendor">Open AI</span></div></div>
      <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭管理弹窗"><img src="../assets/figma-agents/234-imgFrame.svg" alt="" /></button>
      <div class="settings-card"><button class="setting-row" id="defaultToggle" type="button" role="switch" aria-checked="true"><span class="setting-copy"><strong>设置为默认Agent</strong><small>将本 Agent 设置为默认主 Agent 选择</small></span><span class="switch" aria-hidden="true"><img src="../assets/figma-agents/234-imgFrame2147239644.svg" alt="" /></span></button><img class="setting-divider" src="../assets/figma-agents/234-imgVector4203.svg" alt="" /><button class="setting-row" id="autoStartToggle" type="button" role="switch" aria-checked="true"><span class="setting-copy"><strong>启动权限</strong><small>打开本程序时自动启动此代理</small></span><span class="switch" aria-hidden="true"><img src="../assets/figma-agents/234-imgFrame2147239644.svg" alt="" /></span></button></div>
      <div class="settings-card account-card"><div class="setting-row"><span class="setting-copy"><strong>连接账户</strong><small id="accountText">检查中…</small></span><button class="reconnect" id="reconnectButton" type="button"><img src="../assets/figma-agents/234-imgFrame1.svg" alt="" />重新连接</button></div></div>
      <form class="settings-card api-key-card" id="apiKeyCard" hidden><label for="apiKeyInput">接口密钥</label><div class="api-key-entry"><input id="apiKeyInput" type="password" autocomplete="off" placeholder="填写本机 DeepSeek 密钥" required /><button id="saveApiKeyBtn" type="submit">保存</button></div><small id="apiKeyStatus">密钥仅保存在当前设备</small></form>
      <label class="model-field"><span>默认模型</span><select id="modelPicker"><option>GPT-5.6 Luna</option></select></label>
      <div class="dialog-actions"><button id="dialogCancel" type="button">取消</button><button id="uninstallButton" type="button">卸载</button></div>
    </section>
  </div>
  <script>(()=>{const electron=document.body.classList.contains('electron-window');document.getElementById('newConversation').onclick=()=>{if(window.parent!==window){window.parent.postMessage({type:'open-view',view:'new'},location.protocol==='file:'?'*':location.origin);return}location.assign(new URL(location.protocol==='file:'?'../index.html?electron=1#view=new':`../new-conversation/${electron?'?electron=1':''}`,location.href).href)}})()</script>
  <script src="../browser-api.js?v=20261007-5"></script>
  <script src="./page.js?v=20261007-5"></script>
</body>
</html>
