<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>工具 · Alex Colleague Agent</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{overflow:hidden;background:#315b86 url('../desktop-background.png') center/cover fixed no-repeat;color:#2b2b2b;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(94vw,1512px);height:min(92vh,912px);min-height:680px;margin:4vh auto;display:grid;grid-template-columns:254px 1fr;grid-template-rows:40px 1fr;overflow:hidden;border:.5px solid rgba(17,17,17,.16);border-radius:9px;background:rgba(246,250,255,.80);box-shadow:0 4px 100px 4px rgba(0,0,0,.25)}body:not(.electron-window) .shell{backdrop-filter:blur(26px) saturate(132%);-webkit-backdrop-filter:blur(26px) saturate(132%)}body.electron-window{background:transparent}body.electron-window .shell{width:100%;height:100vh;min-height:0;margin:0;border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}.bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.brand{width:28px;height:28px;margin-left:14px;padding:4px;border:0;background:transparent}.brand img{width:20px;height:20px}.window-controls{height:40px;display:flex}.window-control{width:46px;display:grid;place-items:center;padding:0;border:0;background:transparent}.window-control:hover{background:rgba(17,17,17,.07)}.window-control-icon{width:20px;height:20px;background:url('../figma-window-controls.svg') no-repeat;background-size:106.667px 20px}.window-control-icon.minimize{background-position:0 0}.window-control-icon.maximize{background-position:-43.333px 0}.window-control-icon.close{background-position:-86.667px 0}.sidebar{width:254px;min-width:0;padding:4px 12px 18px;overflow-y:auto;overflow-x:hidden}.name{margin:6px 8px 15px;font-size:18px;font-weight:500;letter-spacing:-.2px}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:transparent;text-align:left}.nav:hover{background:rgba(0,0,0,.045)}.nav img{width:18px;height:18px}.heading{min-height:27px;margin:17px 0 7px;padding:0 10px;color:rgba(17,17,17,.58);font-size:16px}.project{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:10px;background:transparent;text-align:left}.project img{width:18px;height:18px}.workspace{position:relative;margin:0 7px 7px 0;overflow:auto;border:1px solid rgba(17,17,17,.16);border-radius:8px;background:#fff;padding:64px}.workspace h1{margin:0;font-size:32px;font-weight:620}.workspace>p{margin:10px 0 34px;color:rgba(17,17,17,.58)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px}.card{padding:20px;border:1px solid rgba(17,17,17,.14);border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.05)}.card strong{display:block;font-size:16px}.card p{margin:8px 0 0;color:rgba(17,17,17,.58);line-height:1.6}.badge{display:inline-block;margin-top:18px;padding:5px 9px;border-radius:99px;background:#f1f2f6;color:rgba(17,17,17,.5);font-size:12px}@media(max-width:950px){.shell{width:100%;height:100vh;margin:0;border-radius:0;grid-template-columns:210px 1fr}.workspace{padding:40px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <script>if(new URLSearchParams(location.search).has('electron'))document.body.classList.add('electron-window')</script>
  <main class="shell">
    <header class="bar"><button class="brand" type="button"><img src="../figma-sidebar-toggle.svg" alt="" /></button><div class="window-controls"><button class="window-control" type="button"><span class="window-control-icon minimize"></span></button><button class="window-control" type="button"><span class="window-control-icon maximize"></span></button><button class="window-control" type="button"><span class="window-control-icon close"></span></button></div></header>
    <aside class="sidebar"><div class="name">Alex Colleague agent</div><button class="nav" id="newConversation"><img src="../new-conversation.svg" alt="" />新对话</button><button class="nav active"><img src="../assets/tools.svg" alt="" />工具</button><div class="heading">项目</div><button class="project"><img src="../project-collapsed.svg" alt="" />科比和詹姆斯对比</button><button class="project"><img src="../project-expanded.svg" alt="" />体验与智能产品创新</button></aside>
    <section class="workspace"><h1>工具</h1><p>为主进程 Agent、协助 Agent 与插件提供统一入口。</p><div class="grid"><article class="card"><strong>主进程 Agent</strong><p>管理 Codex、Kimi Code、DeepSeek Harness 与 Claude Code 等执行环境。</p><span class="badge">后续接入</span></article><article class="card"><strong>插件与连接器</strong><p>集中管理文件、项目服务和外部协作工具的能力入口。</p><span class="badge">后续接入</span></article></div></section>
  </main>
  <script>(()=>{const electron=document.body.classList.contains('electron-window');document.getElementById('newConversation').onclick=()=>location.assign(`/new-conversation/${electron?'?electron=1':''}`)})()</script>
</body>
</html>
